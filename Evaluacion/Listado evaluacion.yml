info:
  name: Listado evaluacion
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}Evaluacion/Evaluacion?codCita={{num_cita}}"
  params:
    - name: codCita
      value: "{{num_cita}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
